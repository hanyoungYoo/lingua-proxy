name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste prompt content you would not publish. In particular,
        never attach `~/.lingua-proxy/memo.jsonl` — it contains your prompts in
        plaintext.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Start the proxy with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `lingua-proxy doctor`
      description: This redacts credentials automatically.
      render: text
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Input language
      placeholder: Korean, Japanese, Arabic, ...

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: claude-sonnet-4-6
