[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingua-proxy"
version = "0.1.2"
description = "Local reverse proxy that translates non-English LLM traffic to English to cut token costs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hanyoung Yoo" }]
keywords = ["llm", "proxy", "translation", "tokens", "claude", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "lingua-language-detector>=2.2",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.scripts]
lingua-proxy = "lingua_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/hanyoungYoo/lingua-proxy"
Issues = "https://github.com/hanyoungYoo/lingua-proxy/issues"
Changelog = "https://github.com/hanyoungYoo/lingua-proxy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["lingua_proxy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["lingua_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "network: hits a real upstream; skipped unless LINGUA_BENCH=1",
]
